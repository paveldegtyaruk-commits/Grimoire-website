<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="Сайт Grimoire в разработке. Готовим место для ваших персонажей, историй и приключений в D&D 5e.">
  <title>Grimoire — в разработке</title>
  <link rel="icon" href="assets/icon.png" type="image/png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <header class="header"><span class="wordmark">GRIMOIRE</span><span class="header-note">СПУТНИК ВАШИХ ПРИКЛЮЧЕНИЙ</span></header>
    <main class="main">
      <div class="sigil" aria-hidden="true">
        <div class="orbit orbit-outer"></div><div class="orbit orbit-inner"></div>
        <span class="star star-top"></span><span class="star star-left"></span><span class="star star-right"></span>
        <picture>
          <source media="(min-width: 601px)" srcset="assets/grimoire-splash.png" width="2048" height="1847">
          <img src="assets/grimoire-logo.png" width="1024" height="1024" alt="">
        </picture>
      </div>
      <div class="message">
        <p class="eyebrow"><span class="status-dot" aria-hidden="true"></span>НОВАЯ ГЛАВА УЖЕ БЛИЗКО</p>
        <h1>В разработке</h1>
        <p class="description">Каждой истории нужен свой гримуар.<br>Мы готовим место для вашей.</p>
        <div class="ornament" aria-hidden="true"><span></span><i></i><span></span></div>
        <p class="return-note">Загляните чуть позже — приключение только начинается.</p>
      </div>
    </main>
    <footer class="footer"><span>grimoireapp.app</span><span>ПЕРСОНАЖИ. ИСТОРИИ. ПРИКЛЮЧЕНИЯ.</span></footer>
  </div>
</body>
</html>
